<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videojuego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 0;
        }
        .gallery-img {
            transition: transform 0.3s ease;
            height: 250px;
            object-fit: cover;
        }
        .gallery-img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="bg-dark text-light">

    <!-- HEADER DE MIRI -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top shadow">
            <div class="container">
                <a class="navbar-brand fw-bold text-warning" href="#">🎮 PixelQuest</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="#galeria">Galería</a></li>
                        <li class="nav-item"><a class="nav-link" href="#noticias">Noticias</a></li>
                        <li class="nav-item"><a class="btn btn-warning text-dark ms-lg-3 fw-semibold" href="#">Descargar</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- GALERIA MIRI -->
    <main style="margin-top: 70px;">
        <section id="galeria" class="container py-5">
            <div class="text-center mb-5">
                <h2 class="fw-bold text-warning">Galería del Videojuego</h2>
                <p class="text-secondary">Un vistazo a los mundos, personajes y combates que te esperan.</p>
            </div>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card bg-secondary bg-opacity-10 border-secondary">
                        <img src="https://th.bing.com/th/id/R.d0bf684a7a0bc8d2a7a8d1388cb4d404?rik=2cFJq3TqhDxpRA&pid=ImgRaw&r=0" 
                        class="card-img-top gallery-img" 
                        alt="Mundos infinitos">
                        <div class="card-body">
                            <h5 class="card-title text-warning">Minecraft</h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-secondary bg-opacity-10 border-secondary">
                        <img src="https://tse3.mm.bing.net/th/id/OIP.w4bKnMoZKEOiMnFm0wbx7AHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
                        class="card-img-top gallery-img" 
                        alt="Acción del videojuego">
                        <div class="card-body">
                            <h5 class="card-title text-warning">Got Of War</h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-secondary bg-opacity-10 border-secondary">
                        <img src="https://wallpapers.com/images/hd/black-and-blue-pac-man-game-interface-ya0cckspdjxgtd47.jpg" 
                        class="card-img-top gallery-img" alt="clasicos de los videojuegos">
                        <div class="card-body">
                            <h5 class="card-title text-warning">Pac-Man</h5>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
